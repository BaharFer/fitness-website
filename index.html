<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0f14" />

    <title>Pulse — Train Smart. Live Better.</title>
    <meta
      name="description"
      content="Science-backed training programs, elite coaching, and a community that pushes you beyond your limits. Join 25,000+ members worldwide."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pulse-training.example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pulse" />
    <meta property="og:title" content="Pulse — Train Smart. Live Better." />
    <meta
      property="og:description"
      content="Science-backed training programs, elite coaching, and a community that pushes you beyond your limits."
    />
    <meta property="og:url" content="https://pulse-training.example.com/" />
    <meta property="og:image" content="/og-cover.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pulse — Train Smart. Live Better." />
    <meta
      name="twitter:description"
      content="Science-backed training programs, elite coaching, and a community that pushes you beyond your limits."
    />
    <meta name="twitter:image" content="/og-cover.svg" />

    <!-- Preconnects for self-hosted fonts served from the same origin build -->
    <link rel="preload" as="image" href="/src/assets/images/hero-athlete.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsActivityLocation",
        "name": "Pulse",
        "description": "Science-backed training programs, elite coaching, and a community that pushes you beyond your limits.",
        "url": "https://pulse-training.example.com/",
        "sameAs": [
          "https://instagram.com/pulse",
          "https://tiktok.com/@pulse",
          "https://youtube.com/@pulse"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
